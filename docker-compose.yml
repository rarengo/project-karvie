version: '3.8'

services:
  # 1. Database Layer: PostgreSQL 16 + pgvector (Resource Capped: 1.5GB RAM)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: karvie-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karvie_db}
      POSTGRES_USER: ${POSTGRES_USER:-karvie_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karvie_secure_password_change_me!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karvie_admin} -d ${POSTGRES_DB:-karvie_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Caching & PubSub State Store (Resource Capped: 512MB RAM)
  redis:
    image: redis:7-alpine
    container_name: karvie-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Local Utility Inference & Embeddings: Ollama (Resource Capped: 8GB RAM max)
  ollama:
    image: ollama/ollama:latest
    container_name: karvie-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8192M

  # 4. LiteLLM Proxy & Router (Resource Capped: 512MB RAM)
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.45.0
    container_name: karvie-litellm
    restart: always
    ports:
      - "${LITELLM_PORT:-8000}:4000"
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-karvie-local-master-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - redis
      - ollama

  # 5. Karvie RAG Memory & AST Indexer Service (Python 3.12 + FastAPI)
  memory-service:
    build:
      context: ./services/memory-service
      dockerfile: Dockerfile
    container_name: karvie-memory-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-karvie_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karvie_secure_password_change_me!}
      POSTGRES_DB: ${POSTGRES_DB:-karvie_db}
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-karvie-local-master-key}
      PORT: 8081
    volumes:
      - ./vault:/app/vault:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started

  # 6. Karvie LangGraph Multi-Agent Orchestrator (Python 3.12 + FastAPI)
  agent-orchestrator:
    build:
      context: ./services/agent-orchestrator
      dockerfile: Dockerfile
    container_name: karvie-agent-orchestrator
    restart: always
    ports:
      - "8082:8082"
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-karvie-local-master-key}
      PORT: 8082
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      - litellm
      - memory-service

  # 7. Karvie Web UI Dashboard (Vue 3 + Glassmorphism + NGINX)
  web-dashboard:
    build:
      context: ./services/web-dashboard
      dockerfile: Dockerfile
    container_name: karvie-web-dashboard
    restart: always
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - litellm
      - memory-service
      - agent-orchestrator

volumes:
  pgdata:
  redisdata:
  ollamadata:
